name: Android

# À chaque push sur main : vérifie, compile l'APK, et si la version de
# package.json n'a pas encore de release, publie automatiquement « vX.Y.Z ».
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Vérifier le code
        run: pnpm check

      - name: Tests (migrations, comparaison des réponses, révisions, rappels)
        run: pnpm test

      - name: Construire l'app web et synchroniser Android
        run: pnpm android:sync

      - name: Lire la version
        id: version
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" > /dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Préparer la clé de signature
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Compiler l'APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Maven Central limite parfois les téléchargements (erreur 429) : on réessaie jusqu'à 3 fois.
          gradle_retry() {
            for attempt in 1 2 3; do
              ./gradlew "$@" --no-daemon && return 0
              echo "::warning::Gradle a échoué (tentative $attempt/3), nouvel essai dans $((attempt * 45)) s…"
              sleep $((attempt * 45))
            done
            return 1
          }
          if [ "$HAS_KEYSTORE" = "true" ]; then
            gradle_retry assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/logidex-v${{ steps.version.outputs.version }}.apk"
          else
            echo "::warning::Pas de clé de signature (secrets ANDROID_*) : APK de debug seulement, aucune release publiée."
            gradle_retry assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/logidex-v${{ steps.version.outputs.version }}-debug.apk"
          fi

      - name: Garder l'APK (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: logidex-apk
          path: ${{ runner.temp }}/logidex-*.apk
          retention-days: 14

      - name: Publier la release
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main' &&
          steps.version.outputs.released == 'false' &&
          env.HAS_KEYSTORE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Logidex ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: ${{ runner.temp }}/logidex-v${{ steps.version.outputs.version }}.apk
